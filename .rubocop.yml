---
plugins:
  - rubocop-minitest
  - rubocop-rake
  - rubocop-rspec
AllCops:
  TargetRubyVersion: 4.0.5
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "test/tmp/**/*"
    - "vendor/bundle/**/*"
Style/StringLiterals:
  EnforcedStyle: double_quotes
Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes
Style/Documentation:
  Enabled: false
Minitest/MultipleAssertions:
  Enabled: false
